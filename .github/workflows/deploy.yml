name: deploy
on:
  push: { branches: [main] }
  schedule: [{ cron: '0 3 * * *' }]
  workflow_dispatch:
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  nrt:
    runs-on: ubuntu-latest
    permissions: { contents: read }  # this job fetches FIRMS with the map key; it never needs Pages rights
    env:
      GH_TOKEN: ${{ github.token }}
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0
        with: { fetch-depth: 0 }  # full history: pytest checks the pre-registration commit precedes reports/
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: { python-version: '3.11', cache: pip }
      - run: pip install -r requirements.txt -c constraints.txt
      - name: Download data-current (district normals)
        run: mkdir -p web/public/data && gh release download data-current -p public-data.tar.gz -O - | tar -xz -C web/public/data
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: data/nrt
          key: nrt-season-${{ github.run_id }}
          restore-keys: nrt-season-
      - run: python -m kilnwatch nrt
      - name: Refresh ask.json (optional; never blocks the data deploy)
        env: { GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}' }  # this step only: pip and pytest never see the key
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            python -m kilnwatch ask --build-cache --src web/public/data || echo "::warning::ask cache refresh failed; the release copy stays"
          else
            echo "::warning::GEMINI_API_KEY not set; ask.json not refreshed"
          fi
      - run: pytest -q  # the full suite gates every deploy, not just the export checks
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with: { name: nrt, path: web/public/data/nrt/ }
      # a single file: the release tarball is extracted in this folder, so never upload web/public/data as a whole
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with: { name: ask, path: web/public/data/ask.json, if-no-files-found: ignore }
  news:
    # Off until someone adds the GEMINI_API_KEY secret, after the Gemini terms question is settled (docs/news_plan.md §10).
    # A failure here never blocks the deploy: the deploy job pairs yesterday's store instead.
    if: github.event_name != 'push'  # daily cron and manual runs only: a push to main must not spend model quota
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions: { contents: write, models: read }  # store -> news-current asset; GitHub Models as the last fallback
    env:
      GH_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}  # optional fallbacks (NEWS_PROVIDERS); unset = skipped
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GITHUB_MODELS_TOKEN: ${{ github.token }}
    steps:
      - if: env.GEMINI_API_KEY == ''
        run: echo "::notice::news is off (no GEMINI_API_KEY secret)"
      - if: env.GEMINI_API_KEY != ''
        uses: actions/checkout@v4
      - if: env.GEMINI_API_KEY != ''
        uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - if: env.GEMINI_API_KEY != ''
        run: pip install -r requirements.txt
      - if: env.GEMINI_API_KEY != ''
        name: Restore the store from news-current
        run: mkdir -p data/news && (gh release download news-current -p news-store.json -O data/news/store.json || echo "::notice::no news-current asset yet; starting an empty store")
      - if: env.GEMINI_API_KEY != ''
        run: python -m kilnwatch news
      - if: env.GEMINI_API_KEY != ''
        run: python -m kilnwatch news --publish
  deploy:
    needs: [nrt, news]
    if: always() && (needs.nrt.result == 'success' || needs.nrt.result == 'skipped')
    runs-on: ubuntu-latest
    permissions: { contents: read, pages: write, id-token: write }  # only the deploy job holds Pages rights
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0
      - run: mkdir -p web/public/data && gh release download data-current -p public-data.tar.gz -O - | tar -xz -C web/public/data
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with: { name: nrt, path: web/public/data/nrt }
      - name: Download news-current (absent = no news page)
        run: mkdir -p data/news && (gh release download news-current -p news-store.json -O data/news/store.json || echo "::notice::no news-current asset; the news page stays hidden")
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - name: Pair the news with the satellite data being deployed (no AI, no network)
        run: |
          if [ -f data/news/store.json ]; then
            pip install -q -r requirements.txt && python -m kilnwatch news-pair
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        continue-on-error: true  # no ask artifact (no key, or none built) keeps the release copy
        with: { name: ask, path: web/public/data }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci && DATA_SRC=real npm run build
      - name: Safety checks
        run: |
          ! grep -rEq '"(kiln_id|cluster_id|candidate|kiln_lat|kiln_lon)"' web/dist/data
          pip install -q pandas numpy && python -m kilnwatch export --check-public web/dist/data
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with: { path: web/dist }
      - id: d
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
  notify:
    needs: [nrt, deploy]
    if: failure()
    runs-on: ubuntu-latest
    permissions: { issues: write }  # the only job with issue rights; it holds no data secrets
    env: { GH_TOKEN: '${{ github.token }}', GH_REPO: '${{ github.repository }}' }
    steps:
      - run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          num=$(gh issue list --state open --search 'in:title "Daily deploy failed"' --json number --jq '.[0].number // empty')
          if [ -z "$num" ]; then
            gh issue create --title "Daily deploy failed ($(date -u +%F))" \
              --body "The daily NRT update or Pages deploy failed; the last good deployment stays live. Run: $run_url. Follow docs/BLOCKERS.md; close this issue when a green deploy lands."
          else
            gh issue comment "$num" --body "Failed again: $run_url"
          fi
