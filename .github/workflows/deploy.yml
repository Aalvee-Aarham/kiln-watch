name: deploy
on:
  push: { branches: [main] }
  schedule: [{ cron: '0 3 * * *' }]
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  nrt:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - run: pip install -r requirements.txt
      - name: Download data-current (district normals)
        run: mkdir -p web/public/data && gh release download data-current -p public-data.tar.gz -O - | tar -xz -C web/public/data
      - uses: actions/cache@v4
        with:
          path: data/nrt
          key: nrt-season-${{ github.run_id }}
          restore-keys: nrt-season-
      - run: python -m kilnwatch nrt
      - run: pytest -q tests/test_export.py
      - uses: actions/upload-artifact@v4
        with: { name: nrt, path: web/public/data/nrt/ }
  news:
    # Off until someone adds the GEMINI_API_KEY secret, after the Gemini terms question is settled (docs/news_plan.md §10).
    # A failure here never blocks the deploy: the deploy job pairs yesterday's store instead.
    if: github.event_name != 'push'  # daily cron and manual runs only: a push to main must not spend model quota
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions: { contents: write }  # uploads the store to the news-current release asset
    env:
      GH_TOKEN: ${{ github.token }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - if: env.GEMINI_API_KEY == ''
        run: echo "::notice::news is off (no GEMINI_API_KEY secret)"
      - if: env.GEMINI_API_KEY != ''
        uses: actions/checkout@v4
      - if: env.GEMINI_API_KEY != ''
        uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - if: env.GEMINI_API_KEY != ''
        run: pip install -r requirements.txt
      - if: env.GEMINI_API_KEY != ''
        name: Restore the store from news-current
        run: mkdir -p data/news && (gh release download news-current -p news-store.json -O data/news/store.json || echo "::notice::no news-current asset yet; starting an empty store")
      - if: env.GEMINI_API_KEY != ''
        run: python -m kilnwatch news
      - if: env.GEMINI_API_KEY != ''
        run: python -m kilnwatch news --publish
  deploy:
    needs: [nrt, news]
    if: always() && (needs.nrt.result == 'success' || needs.nrt.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p web/public/data && gh release download data-current -p public-data.tar.gz -O - | tar -xz -C web/public/data
      - uses: actions/download-artifact@v4
        with: { name: nrt, path: web/public/data/nrt }
      - name: Download news-current (absent = no news page)
        run: mkdir -p data/news && (gh release download news-current -p news-store.json -O data/news/store.json || echo "::notice::no news-current asset; the news page stays hidden")
      - uses: actions/setup-python@v5
        with: { python-version: '3.11', cache: pip }
      - name: Pair the news with the satellite data being deployed (no AI, no network)
        run: |
          if [ -f data/news/store.json ]; then
            pip install -q -r requirements.txt && python -m kilnwatch news-pair
          fi
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci && DATA_SRC=real npm run build
      - name: Safety checks
        run: |
          ! grep -rEq '"(kiln_id|cluster_id|candidate|kiln_lat|kiln_lon)"' web/dist/data
          pip install -q pandas numpy && python -m kilnwatch export --check-public web/dist/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: web/dist }
      - id: d
        uses: actions/deploy-pages@v4
