name: deploy
on:
  push: { branches: [main] }
  schedule: [{ cron: '0 3 * * *' }]
  workflow_dispatch:
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  nrt:
    runs-on: ubuntu-latest
    permissions: { contents: read }  # this job fetches FIRMS with the map key; it never needs Pages rights
    env:
      GH_TOKEN: ${{ github.token }}
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with: { python-version: '3.11', cache: pip }
      - run: pip install -r requirements.txt -c constraints.txt
      - name: Download data-current (district normals)
        run: mkdir -p web/public/data && gh release download data-current -p public-data.tar.gz -O - | tar -xz -C web/public/data
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: data/nrt
          key: nrt-season-${{ github.run_id }}
          restore-keys: nrt-season-
      - run: python -m kilnwatch nrt
      - name: Refresh ask.json (optional; never blocks the data deploy)
        env: { ANTHROPIC_API_KEY: '${{ secrets.ANTHROPIC_API_KEY }}' }  # this step only: pip and pytest never see the key
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            python -m kilnwatch ask --build-cache --src web/public/data || echo "::warning::ask cache refresh failed; the release copy stays"
          else
            echo "::warning::ANTHROPIC_API_KEY not set; ask.json not refreshed"
          fi
      - run: pytest -q  # the full suite gates every deploy, not just the export checks
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with: { name: nrt, path: web/public/data/nrt/ }
      # a single file: the release tarball is extracted in this folder, so never upload web/public/data as a whole
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with: { name: ask, path: web/public/data/ask.json, if-no-files-found: ignore }
  deploy:
    needs: nrt
    if: always() && (needs.nrt.result == 'success' || needs.nrt.result == 'skipped')
    runs-on: ubuntu-latest
    permissions: { contents: read, pages: write, id-token: write }  # only the deploy job holds Pages rights
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955  # v4.3.0
      - run: mkdir -p web/public/data && gh release download data-current -p public-data.tar.gz -O - | tar -xz -C web/public/data
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with: { name: nrt, path: web/public/data/nrt }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        continue-on-error: true  # no ask artifact (no key, or none built) keeps the release copy
        with: { name: ask, path: web/public/data }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: cd web && npm ci && DATA_SRC=real npm run build
      - name: Safety checks
        run: |
          ! grep -rEq '"(kiln_id|cluster_id|candidate|kiln_lat|kiln_lon)"' web/dist/data
          pip install -q pandas numpy && python -m kilnwatch export --check-public web/dist/data
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with: { path: web/dist }
      - id: d
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
